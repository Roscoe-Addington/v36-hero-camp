<style>
  /* Layout: a narrow guide column (steps + explanation) above a mock browser
     window that shows the app's real pages, rendered by the app's own code. */
  :root {
    --bg: #eceff3;
    --surface: #ffffff;
    --fg: #16202b;
    --muted: #556272;
    --line: #d3dae3;
    --accent: #1f5f8b;
    --accent-soft: #e3eef7;
    --chrome: #dfe4ea;
    --font-ui: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151b; --surface: #19212a; --fg: #e5eaf0; --muted: #9aa7b6;
      --line: #2c3743; --accent: #74b3df; --accent-soft: #1d3346; --chrome: #232c36;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10151b; --surface: #19212a; --fg: #e5eaf0; --muted: #9aa7b6;
    --line: #2c3743; --accent: #74b3df; --accent-soft: #1d3346; --chrome: #232c36;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    gap: 16px;
  }

  .head { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
  .head h1 { margin: 0; font-size: 1.6rem; line-height: 1.2; text-wrap: balance; }
  .head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }

  button.ui {
    font: inherit; font-size: 0.9rem; font-weight: 700;
    padding: 7px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  }
  button.ui:hover { border-color: var(--accent); }
  button.ui[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  button.ui.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  button.ui:focus-visible, .steps a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* The real flow is a sequence, so the steps are numbered. */
  .steps { overflow-x: auto; }
  .steps ol {
    list-style: none; margin: 0; padding: 0;
    display: flex; gap: 6px; min-width: max-content;
  }
  .steps a {
    display: flex; gap: 8px; align-items: baseline;
    padding: 8px 12px; border-radius: 6px; text-decoration: none;
    color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  }
  .steps a .n { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
  .steps a .who { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .steps a[aria-current="page"] { border-color: var(--accent); background: var(--accent-soft); }
  .steps a[aria-current="page"] .n, .steps a[aria-current="page"] .who { color: var(--accent); }

  .context {
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px;
  }
  .context p { margin: 0; flex: 1 1 320px; min-width: 0; max-width: 70ch; }
  .context .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .window {
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    background: var(--surface); width: 100%; margin: 0 auto;
    transition: max-width 200ms ease;
  }
  .window.phone { max-width: 400px; }
  .bar {
    display: flex; gap: 10px; align-items: center;
    padding: 8px 12px; background: var(--chrome); border-bottom: 1px solid var(--line);
  }
  .dots { display: flex; gap: 6px; flex: none; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .addr {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted);
    background: var(--surface); border-radius: 5px; padding: 4px 10px;
  }
  .lock { color: var(--muted); font-size: 0.8rem; flex: none; }
  /* The app's own pages keep their own (light) look, like a real website would. */
  #screen { min-height: 480px; background: #f6f7f9; }

  .foot { color: var(--muted); font-size: 0.85rem; max-width: 80ch; }

  @media (prefers-reduced-motion: reduce) { .window { transition: none; } }
</style>

    ['interview', 'medical', 'Hypertension.', 'Högt blodtryck.'],
    ['interview', 'medicines', 'Amlodipine 5 mg.', 'Amlodipin 5 mg.'],
    ['interview', 'substance_notes', 'Two glasses of wine a week.', 'Två glas vin i veckan.'],
    ['interview', 'living', 'Lives alone; daughter visits weekly.', 'Bor ensam; dottern hälsar på varje vecka.'],
    ['interview', 'occupation', 'Retired teacher.', 'Pensionerad lärare.'],
    ['interview', 'mse_appearance', 'Neatly dressed, good eye contact.', 'Välvårdad, god ögonkontakt.'],
    ['interview', 'mse_mood', '"Empty"', '”Tom”'],
    ['interview', 'mse_thought_notes', 'Thoughts about her husband; no suicidal thoughts reported.', 'Tankar kring maken; inga självmordstankar.'],
    ['informant', 'inf_relationship', 'Daughter', 'Dotter'],
    ['informant', 'inf_memory_course', 'Forgetting appointments for about a year, slowly worse.', 'Glömmer tider sedan ungefär ett år, långsamt sämre.'],
    ['mddChecklist', 'notes', 'Ask the daughter about any past periods of elevated mood before rating E.', 'Fråga dottern om tidigare perioder med förhöjt stämningsläge innan E skattas.'],
  ];

  // The language chosen in the app's top bar applies to the whole demo: the
  // demo page, the clinician pages, and the example patient's language (so
  // the patient pages and the screening are in it too), and the sample notes.
  function setDemoLanguage(lang) {
    CLINICIAN.language = lang;
    state.patient.preferred_language = lang;
    state.language = lang;
    state.followupLanguage = lang;
    const parts = { intake: state.intake, interview: state.interview, informant: state.informant, mddChecklist: state.checklists.mdd };
    for (const [part, field, en, sv] of SAMPLE_TEXTS) {
      const obj = parts[part];
      if (obj && obj[field] === (lang === 'sv' ? en : sv)) obj[field] = lang === 'sv' ? sv : en;
    }
  }

  const now = () => new Date().toISOString().slice(0, 16).replace('T', ' ');
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const zeroAnswers = () => Object.fromEntries(D.parseAnswers({}).errors.map((id) => [id, 0]));

  let state;
  function reset() {
    state = {
      deleted: false,
      patient: { ...SAMPLE_PATIENT },
      // The example patient answered the screening at home by link, so the speed check applies.
      mode: 'link', language: 'en', started: true, showLink: false, consent: true,
      answers: { ...zeroAnswers(), ...SAMPLE_ANSWERS }, draft: null,
      completedAt: '2026-10-02 10:05',
      intake: clone(SAMPLE_INTAKE), interview: clone(SAMPLE_INTERVIEW), informant: clone(SAMPLE_INFORMANT), risk: null,
      checklists: clone(SAMPLE_CHECKLISTS), diagnoses: { items: [], finalNote: '' }, finalizedAt: null, amendments: [],
      disorder: 'mdd', errors: [],
      // One earlier follow-up, a month after the intake screening.
      followups: [{ id: 1, mode: 'onsite', language: 'en', completed_at: '2026-11-03 09:15', expires_at: '2099-01-01', revoked: 0,
        results_json: JSON.stringify(D.scoreFollowup({ ...Object.fromEntries(['phq1','phq2','phq3','phq4','phq5','phq6','phq7','phq8','phq9','phqDifficulty','gad1','gad2','gad3','gad4','gad5','gad6','gad7','gadDifficulty'].map((k) => [k, 0])), phq1: 1, phq2: 1, phq3: 2, phq4: 1, phq7: 2, gad1: 1 })) }],
      followupLink: null, followupLanguage: 'en', followupMode: 'onsite',
      audit: [],
      page: 0, missing: [], breakAfter: null,
      meta: sampleMeta(),
      grants: [],
    };
    score();
  }

  // Example timing: about 6 seconds per question, but part 9 rushed (1.2 s per
  // question), and a tiredness rating of 8 after part 6 without a break.
  function sampleMeta() {
    const pages = {};
    let t = Date.parse('2026-10-02T09:40:00Z');
    for (const page of D.PAGES) {
      const n = page.items.filter((i) => D.isShown(i, { ...zeroAnswers(), ...SAMPLE_ANSWERS })).length;
      const seconds = page.part === 9 ? n * 1.2 : n * 6;
      pages[page.part] = { shown: t, submitted: t + seconds * 1000, answered: n };
      t += seconds * 1000 + 5000;
    }
    return { pages, contradictions: [], tiredness: [{ part: 3, value: 4, at: pages[3].submitted }, { part: 6, value: 8, at: pages[6].submitted }] };
  }
  function startAssessment(mode, language) {
    Object.assign(state, {
      mode, language, started: true, showLink: mode === 'link', consent: false, completedAt: null, draft: null,
      intake: null, interview: null, informant: null, risk: null, checklists: {}, diagnoses: { items: [], finalNote: '' },
      finalizedAt: null, amendments: [], disorder: null, errors: [],
      page: 0, missing: [], breakAfter: null, meta: { pages: {}, tiredness: [], contradictions: [] }, draft: {},
    });
  }
  function score() {
    const results = D.scoreAll(state.answers);
    results.differential = D.runDifferential(state.answers, state.patient, results);
    results.quality = D.responseQuality(state.answers, state.meta, state.mode);
    state.results = results;
  }
  function log(action, detail) {
    state.audit.unshift({ at: now(), clinician_id: viewer().id, clinician_name: viewer().name, action, assessment_id: action.includes('patient') || action.includes('followup') ? null : 1, detail: detail || null });
  }

  // The same "case" object the server builds in loadCase().
  function caseObject() {
    return {
      assessment: {
        id: 1, mode: state.mode, language: state.language, created_at: '2026-10-02 09:58', expires_at: '2099-01-01T00:00:00Z', revoked: 0,
        completed_at: state.completedAt, finalized_at: state.finalizedAt, consent_at: state.consent ? '2026-10-02 10:00' : null,
        email_status: L('emailStatus'),
      },
      patient: state.patient,
      readOnly: asSupervisor,
      ownerName: CLINICIAN.name,
      answers: state.completedAt ? state.answers : null,
      results: state.completedAt ? state.results : null,
      intake: state.intake, interview: state.interview, informant: state.informant, risk: state.risk,
      checklists: state.checklists, diagnoses: state.diagnoses, amendments: state.amendments,
      defaultLowEducation: D.defaultLowEducation(state.patient),
    };
  }
  const suggestions = (c) => D.buildSuggestions({ answers: c.answers, results: c.results, patient: c.patient, intake: c.intake, interview: c.interview, informant: c.informant });
  function assessmentRow(c) {
    return { ...c.assessment, results_json: state.completedAt ? JSON.stringify(state.results) : null };
  }

  // ---------- Rendering an app page inside a shadow root ----------
  const screen = document.getElementById('screen');
  const shadow = screen.attachShadow({ mode: 'open' });
  const appCss = D.appCss.replace(/:root/g, ':host').replace(/(^|\n)body\s*\{/g, '$1.app-body {');
  const extraCss = `
    .app-body { min-height: 480px; }
    .mail { max-width: 820px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
    .mail dl { display: grid; grid-template-columns: max-content 1fr; gap: .3rem 1rem; margin: 0 0 1rem; }
    .mail dt { color: var(--muted); } .mail dd { margin: 0; overflow-wrap: anywhere; }
    .mail pre { white-space: pre-wrap; overflow-wrap: anywhere; font: .85rem/1.5 ui-monospace, Menlo, monospace;
                background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin: 0; }
    .urgent { color: var(--danger); font-weight: 700; }`;
  const bodyOf = (page) => new DOMParser().parseFromString(String(page), 'text/html').body.innerHTML;
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function pathOf(view) {
    const map = {
      login: '/login', patients: '/clinician', 'new-patient': '/clinician/patients/new', patient: PATIENT,
      'edit-patient': PATIENT + '/edit', deleted: PATIENT + '/delete', audit: PATIENT + '/audit', followup: PATIENT,
      screening: (state.mode === 'link' ? '/q/' + TOKEN : BASE + '/screening') + '?page=' + state.page,
      break: '/q/' + TOKEN + '?page=' + (state.page - 1), retention: '/clinician/retention', consent: '/q/' + TOKEN, saved: '/q/' + TOKEN, thanks: '/q/' + TOKEN,
      case: BASE, interview: BASE + '/interview', informant: BASE + '/informant', risk: BASE + '/risk', plan: BASE + '/risk/plan',
      checklist: BASE + '/checklist?disorder=' + (state.disorder || ''), final: state.finalizedAt ? BASE + '/final' : BASE,
      'followup-form': state.followupMode === 'link' ? '/f/' + FTOKEN : '/clinician/followups/2', 'followup-thanks': '/f/' + FTOKEN,
    };
    return map[view] ?? null;
  }

  // The record is kept 10 years after its last entry (src/retention.js).
  function keptUntil() {
    const dates = [state.completedAt, state.finalizedAt, ...state.followups.map((f) => f.completed_at)].filter(Boolean).map((d) => Date.parse(d.replace(' ', 'T') + 'Z'));
    if (!dates.length) return null;
    const d = new Date(Math.max(...dates));
    d.setUTCFullYear(d.getUTCFullYear() + 10);
    return d;
  }
  // Other clinician accounts in this demo, for "Who has access".
  const DEMO_ACCOUNTS = { 'supervisor@clinic.example': 'Dr Supervisor', 'colleague@clinic.example': 'Dr Colleague' };

  const notStarted = () => `<main><h1>${esc(L('notStartedTitle'))}</h1><p>${esc(L('notStarted'))}</p></main>`;

  function pageHtml(view) {
    const V = D.views, W = D.workflow;
    const p = state.patient;
    const c = caseObject();
    if (state.deleted && !['login', 'deleted', 'audit', 'new-patient'].includes(view)) {
      return bodyOf(V.messagePage({ title: L('deletedTitle'), message: L('deletedGone'), clinician: viewer() }));
    }
    switch (view) {
      case 'login': return bodyOf(V.loginPage());
      case 'patients': return bodyOf(V.dashboardPage({ clinician: viewer(), patients: [{
        id: 1, first_name: p.first_name, last_name: p.last_name, age: p.age,
        latest_completed: state.completedAt, latest_safety: state.completedAt && state.results.safetyFlag ? 1 : 0,
        has_pending: state.started && !state.completedAt ? 1 : 0,
      }] }));
      case 'new-patient': return bodyOf(V.newPatientPage({ clinician: viewer() }));
      case 'edit-patient': return bodyOf(V.newPatientPage({ clinician: viewer(), patient: p, values: { ...p, age: String(p.age), employed: String(p.employed) }, errors: state.errors }));
      case 'patient':
      case 'followup': return bodyOf(V.patientPage({
        clinician: viewer(), patient: p, errors: state.errors,
        assessments: state.started ? [assessmentRow(c)] : [],
        newLink: state.showLink ? { url: HOST + '/q/' + TOKEN, expires: '2026-11-20' } : null,
        followups: state.followups,
        followupLink: state.followupLink,
        access: asSupervisor
          ? { owner: false, role: 'supervisor', grant: { granted_by_name: CLINICIAN.name, reason: L('supervisionReason'), expires_at: null } }
          : { owner: true },
        owner: CLINICIAN, grants: state.grants, keptUntil: keptUntil(), retentionYears: 10,
      }));
      case 'consent': return bodyOf(V.consentPage({ action: '/q/' + TOKEN + '/consent', language: state.language, error: state.errors[0] }));
      case 'screening':
        if (state.mode === 'link' && !state.consent) return pageHtml('consent');
        return state.mode === 'link'
          ? bodyOf(V.questionnairePage({ action: '/q/' + TOKEN, pageIndex: state.page, language: state.language, answers: state.draft ?? state.answers, error: state.errors[0], missing: state.missing }))
          : bodyOf(V.questionnairePage({ action: BASE + '/screening', pageIndex: state.page, clinician: viewer(), patient: p, language: state.language, answers: state.draft ?? state.answers, consentDone: state.consent, error: state.errors[0], missing: state.missing }));
      case 'break': return bodyOf(V.breakPage({ language: state.language, continueUrl: '/q/' + TOKEN + '?page=' + state.page, stopAction: '/q/' + TOKEN + '?page=' + state.page }));
      case 'retention': return bodyOf(V.retentionPage({ clinician: viewer(), policy: { recordYears: 10, unusedDays: 30, auditYears: 10 },
        due: [{ id: 99, first_name: 'Example', last_name: 'Oldrecord', lastEntry: new Date('2014-05-01T10:00:00Z'), keptUntil: new Date('2024-05-01T10:00:00Z') }] }));
      case 'saved': return bodyOf(V.savedPage({ language: state.language, expires: '2026-11-20' }));
      case 'thanks': return bodyOf(V.thankYouPage({ safetyFlag: state.results.safetyFlag, language: state.language }));
      case 'case': return bodyOf(W.casePage({ clinician: viewer(), c, suggestions: c.results ? suggestions(c) : null, errors: state.errors }));
      case 'interview': return state.started ? bodyOf(W.interviewPage({ clinician: viewer(), c, errors: state.errors })) : notStarted();
      case 'informant': return c.results ? bodyOf(W.informantPage({ clinician: viewer(), c, errors: state.errors })) : notStarted();
      case 'risk': return c.results ? bodyOf(W.riskPage({ clinician: viewer(), c, errors: state.errors })) : notStarted();
      case 'plan': return state.risk ? bodyOf(W.safetyPlanPage({ clinician: viewer(), c })) : pageHtml('risk');
      case 'checklist': {
        if (!c.results) return notStarted();
        const s = suggestions(c);
        const id = state.disorder || s.suggestions[0]?.disorderId || 'mdd';
        state.disorder = id;
        return bodyOf(W.checklistPage({ clinician: viewer(), c, disorder: D.findDisorder(id), suggestion: s.suggestions.find((x) => x.disorderId === id), errors: state.errors }));
      }
      case 'final':
        if (!state.finalizedAt) return pageHtml('case');
        return bodyOf(W.finalReportPage({ clinician: viewer(), c, suggestions: suggestions(c) }));
      case 'followup-form':
        return state.followupMode === 'link'
          ? bodyOf(V.followupPage({ action: '/f/' + FTOKEN, language: state.followupLanguage, error: state.errors[0] }))
          : bodyOf(V.followupPage({ action: '/clinician/followups/2', clinician: viewer(), patient: p, language: state.followupLanguage, error: state.errors[0] }));
      case 'followup-thanks': return bodyOf(V.thankYouPage({ safetyFlag: false, language: state.followupLanguage }));
      case 'audit': return bodyOf(V.auditPage({ clinician: viewer(), patient: p, entries: state.audit, actions: D.ACTIONS }));
      case 'deleted': return bodyOf(V.messagePage({ title: L('deletedTitle'), message: L('deleted'), clinician: viewer() }));
      case 'email': {
        if (!state.completedAt) return `<div class="mail"><h1>${esc(L('inbox'))}</h1><p>${esc(L('noEmail'))}</p></div>`;
        // The app's own email text (src/email.js): no names or health data.
        const urgent = D.isUrgent(state.results);
        const { subject, text } = D.readyEmail({ kind: 'screening', ref: 1, urgent, url: HOST + BASE, language: uiLanguage() });
        return `<div class="mail"><h1>${esc(L('inbox'))}</h1><dl>
          <dt>${esc(L('from'))}</dt><dd>Continuum &lt;continuum@clinic.example&gt;</dd><dt>${esc(L('to'))}</dt><dd>${esc(CLINICIAN.email)}</dd>
          <dt>${esc(L('subject'))}</dt><dd class="${urgent ? 'urgent' : ''}">${esc(subject)}</dd>
        </dl><pre>${esc(text)}</pre></div>`;
      }
    }
    return '<p>Not found</p>';
  }

  // Which views count as a "view" in the audit log.
  const AUDITED = { patient: 'view_patient', followup: 'view_patient', case: 'view_assessment', interview: 'view_interview', informant: 'view_informant', risk: 'view_risk', plan: 'view_safety_plan', final: 'view_final', audit: 'view_audit' };

  function render(view) {
    if (AUDITED[view] && !state.deleted && !(view === 'final' && !state.finalizedAt)) log(AUDITED[view]);
    shadow.innerHTML = `<style>${appCss}${extraCss}</style><div class="app-body">${pageHtml(view)}</div>`;
    if (view === 'screening') {
      // The app's own skip logic (public/skip.js), and the start time of the page.
      D.enableSkipLogic(shadow.querySelector('.app-body'));
      const part = D.PAGES[state.page].part;
      state.meta.pages[part] = { ...state.meta.pages[part], shown: Date.now() };
    }
    if (view === 'new-patient' || view === 'edit-patient') D.enableAgeFromPersonalNumber(shadow.querySelector('.app-body'));
    if (view === 'login') {
      shadow.querySelector('input[name=email]').value = CLINICIAN.email;
      shadow.querySelector('input[name=password]').value = 'demo-password';
    }
    const path = pathOf(view);
    document.getElementById('addr').textContent = path ? HOST + path : L('inboxAddress') + ' — ' + CLINICIAN.email;
    renderChrome(view);
    const stepId = EXTRA[view] ?? view;
    for (const a of document.querySelectorAll('#steps a')) {
      if (a.dataset.view === stepId) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    }
    const ctx = document.getElementById('context');
    ctx.innerHTML = '';
    const p = document.createElement('p');
    const text = L('context')[view];
    p.textContent = typeof text === 'function' ? text() : text || '';
    ctx.append(p);
    const actions = document.createElement('div');
    actions.className = 'actions';
    if (view === 'thanks') actions.append(actionButton(L('continueClinician'), 'case', true), actionButton(L('seeEmail'), 'email'));
    if (view === 'saved') actions.append(actionButton(L('openAgain'), 'screening', true));
    if (view === 'followup-thanks') actions.append(actionButton(L('seeChart'), 'followup', true));
    if (actions.childElementCount) ctx.append(actions);
    state.errors = [];
    // The follow-up step scrolls to the follow-up section of the patient page.
    if (view === 'followup') {
      const target = [...shadow.querySelectorAll('h2')].find((h) => /^(Follow-up|Uppföljning)/.test(h.textContent));
      target?.scrollIntoView({ block: 'start' });
    }
  }

  function actionButton(label, view, primary) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ui' + (primary ? ' primary' : '');
    b.textContent = label;
    b.addEventListener('click', () => go(view));
    return b;
  }

  let current = 'login';
  function go(view, { scroll = true } = {}) {
    current = view;
    try { if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view); } catch (e) {}
    render(view);
    if (scroll && view !== 'followup') document.getElementById('context').scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  // ---------- Making the app's links and forms work in the demo ----------
  function routeFor(href) {
    const url = new URL(href, HOST);
    const path = url.pathname;
    const map = {
      '/login': 'login', '/clinician': 'patients', '/clinician/patients/new': 'new-patient', [PATIENT]: 'patient',
      [PATIENT + '/edit']: 'edit-patient', [PATIENT + '/audit']: 'audit', [BASE]: 'case', [BASE + '/screening']: 'screening',
      [BASE + '/final']: 'final', [BASE + '/interview']: 'interview', [BASE + '/informant']: 'informant', [BASE + '/risk']: 'risk',
      [BASE + '/risk/plan']: 'plan',
    };
    if (path === BASE + '/checklist') { state.disorder = url.searchParams.get('disorder'); return 'checklist'; }
    if (path === '/q/' + TOKEN || path === BASE + '/screening') {
      const n = Number(url.searchParams.get('page'));
      if (Number.isInteger(n) && n >= 0 && n < D.PAGES.length) state.page = n;
      return 'screening';
    }
    if (path === '/clinician/retention') return 'retention';
    return map[path] ?? null;
  }

  shadow.addEventListener('click', (event) => {
    const a = event.target.closest('a[href]');
    if (!a) return;
    const href = a.getAttribute('href');
    event.preventDefault();
    if (href.startsWith('#')) {
      shadow.getElementById(href.slice(1))?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    if (href.endsWith('.pdf')) {
      document.querySelector('#context p').textContent = L('pdf');
      document.getElementById('context').scrollIntoView({ block: 'start', behavior: 'smooth' });
      return;
    }
    const view = routeFor(href);
    if (view) go(view);
  });

  // FormData, keeping repeated keys (checkboxes) as arrays, like the server.
  function formBody(form, submitter) {
    const fd = new FormData(form, submitter);
    const out = {};
    for (const [k, v] of fd.entries()) {
      if (k in out) out[k] = [].concat(out[k], v);
      else out[k] = v;
    }
    return out;
  }

  // The same steps the server does for each form (see src/server.js),
  // using the app's own functions for every rule.
  shadow.addEventListener('submit', (event) => {
    event.preventDefault();
    const form = event.target;
    const action = form.getAttribute('action');
    const data = formBody(form, event.submitter);
    const url = new URL(action, HOST);
    const path = url.pathname;
    const stay = { scroll: false };

    if (path === '/clinician/language') {
      setDemoLanguage(data.language === 'sv' ? 'sv' : 'en');
      return go(current, stay);
    }
    // Colleagues with access can only read (the app's guard in server.js).
    if (asSupervisor && /^\/(clinician\/(patients\/1\/|assessments\/1\/|followups\/)|q\/)/.test(path)) {
      shadow.querySelector('.app-body').innerHTML = D.views.messagePage({ title: 'Read-only access', message: 'You have read-only access to this patient. Only the treating clinician can make changes.', clinician: viewer() }).toString().match(/<main>([\s\S]*)<\/main>/)[1];
      return;
    }
    if (path === '/login') return go('patients');
    if (path === '/logout') return go('login');
    if (path === '/clinician/patients' || path === PATIENT + '/edit') {
      const before = { ...state.patient };
      state.patient = {
        ...state.patient,
        first_name: String(data.first_name).trim() || 'Karin', last_name: String(data.last_name).trim() || 'Lund',
        personal_number: String(data.personal_number).trim() || '19580704-XXXX',
        gender: data.gender, age: Number(data.age), education: data.education, employed: Number(data.employed),
        preferred_language: D.lang(data.preferred_language),
      };
      // The same age rules as validatePatient() in src/server.js.
      const fromNumber = D.ageFromPersonalNumber(state.patient.personal_number);
      if (data.age === '' && fromNumber !== null) state.patient.age = fromNumber;
      const ageError = !Number.isInteger(state.patient.age) || state.patient.age < 16 || state.patient.age > 120
        ? 'Age must be a whole number between 16 and 120.'
        : fromNumber !== null && fromNumber !== state.patient.age ? 'The age does not match the date of birth in the personal number.' : null;
      if (ageError) {
        state.patient = before;
        state.errors = [ageError];
        return go(path.endsWith('/edit') ? 'edit-patient' : 'new-patient', stay);
      }
      const changed = Object.keys(state.patient).filter((k) => String(before[k]) !== String(state.patient[k]));
      log(path.endsWith('/edit') ? 'edit_patient' : 'create_patient', changed.length ? 'Changed: ' + changed.join(', ') : null);
      score();
      return go('patient');
    }
    if (path === PATIENT + '/delete') {
      if (String(data.confirm_last_name).trim().toLowerCase() !== state.patient.last_name.toLowerCase()) {
        state.errors = ['To delete, type the patient’s last name exactly.'];
        return go('patient', stay);
      }
      log('delete_patient', data.reason);
      state.deleted = true;
      return go('deleted');
    }
    if (path === PATIENT + '/assessments') {
      const mode = data.mode === 'onsite' ? 'onsite' : 'link';
      startAssessment(mode, D.lang(data.language));
      state.patient.preferred_language = state.language; // the choice becomes the patient's preference
      log('start_assessment', mode + ', ' + state.language);
      return go(mode === 'onsite' ? 'case' : 'patient', { scroll: mode === 'onsite' });
    }
    if (path === '/q/' + TOKEN + '/consent') {
      if (data.agree !== 'yes') { state.errors = [D.STRINGS[state.language].consentNeeded]; return go('consent', stay); }
      state.consent = true;
      return go('screening');
    }
    if (path === '/q/' + TOKEN || path === BASE + '/screening') {
      // The same steps as handlePage() in src/server.js, with the app's own functions.
      const onsite = path === BASE + '/screening';
      const pageIndex = Number(url.searchParams.get('page')) || 0;
      const page = D.PAGES[pageIndex];
      const moving = !['save', 'back', 'stop'].includes(data.intent);
      if (onsite && !state.consent && pageIndex === 0 && moving) {
        if (data.consent_given !== 'yes') { state.errors = [D.translator(state.language)('Confirm that the patient has been given the information.')]; return go('screening', stay); }
        state.consent = true;
      }
      const draft = state.draft ?? state.answers;
      const parsed = D.parsePage(pageIndex, data, draft);
      state.draft = parsed.answers;
      for (const c of parsed.contradictions) if (!state.meta.contradictions.some((x) => x.child === c.child)) state.meta.contradictions.push(c);
      const tired = Number(data.tired);
      if (page.tiredness && data.tired !== undefined && data.tired !== '') {
        state.meta.tiredness = state.meta.tiredness.filter((t) => t.part !== page.part).concat({ part: page.part, value: tired, at: Date.now() });
      }
      if (data.intent === 'save' || data.intent === 'stop') return go(onsite ? 'case' : 'saved');
      if (data.intent === 'back') { state.page = Math.max(0, pageIndex - 1); return go('screening'); }
      if (parsed.missing.length) {
        state.missing = parsed.missing;
        state.errors = [D.STRINGS[state.language].pageMissing(parsed.missing.length)];
        return go('screening', stay);
      }
      state.missing = [];
      const shownOnPage = page.items.filter((i) => D.isShown(i, parsed.answers)).length;
      state.meta.pages[page.part] = { ...state.meta.pages[page.part], submitted: Date.now(), answered: shownOnPage };
      if (pageIndex < D.PAGES.length - 1) {
        state.page = pageIndex + 1;
        const rating = state.meta.tiredness.find((t) => t.part === page.part);
        if (page.tiredness && rating && rating.value >= D.TIREDNESS_BREAK_AT && !onsite) return go('break');
        return go('screening');
      }
      const full = D.applySkips(parsed.answers).answers;
      const { answers, errors } = D.parseAnswers(full);
      if (errors.length) {
        state.page = D.firstOpenPage(full);
        state.missing = errors;
        state.errors = [D.STRINGS[state.language].pageMissing(errors.length)];
        return go('screening', stay);
      }
      state.answers = answers;
      state.draft = null;
      state.completedAt = now();
      state.showLink = false;
      score();
      if (onsite) log('save_screening');
      return go(onsite ? 'case' : 'thanks');
    }
    if (path === PATIENT + '/access') {
      // Demo version of grantAccess()/revokeAccess() in src/access.js (which needs the database).
      if (data.action === 'revoke') {
        const g = state.grants.find((x) => String(x.id) === String(data.grant));
        if (g) { g.revoked_at = new Date().toISOString(); log('revoke_access', 'Access #' + g.id); }
        return go('patient', stay);
      }
      const email = String(data.email || '').trim().toLowerCase();
      if (!DEMO_ACCOUNTS[email]) { state.errors = [L('noAccount')]; return go('patient', stay); }
      if (!String(data.reason || '').trim()) { state.errors = ['Write why this person needs access.']; return go('patient', stay); }
      const expires = data.until ? new Date(data.until + 'T23:59:59Z').toISOString() : null;
      if (expires && expires <= new Date().toISOString()) { state.errors = ['The end date must be in the future.']; return go('patient', stay); }
      for (const g of state.grants) if (g.clinician_email === email && !g.revoked_at) g.revoked_at = new Date().toISOString();
      state.grants.unshift({ id: state.grants.length + 1, clinician_name: DEMO_ACCOUNTS[email], clinician_email: email, role: data.role, reason: String(data.reason).trim(), expires_at: expires, revoked_at: null });
      log('grant_access', DEMO_ACCOUNTS[email] + ' as ' + (data.role === 'supervisor' ? 'Supervisor' : 'Close colleague') + ': ' + String(data.reason).trim());
      return go('patient', stay);
    }
    // The three schema forms and the MoCA form: parse with the app's own functions.
    const FORMS = {
      [BASE + '/interview']: ['interview', D.parseInterview, 'interview', 'save_interview'],
      [BASE + '/informant']: ['informant', D.parseInformant, 'informant', 'save_informant'],
      [BASE + '/risk']: ['risk', D.parseRisk, 'risk', 'save_risk'],
      [BASE + '/intake']: ['intake', D.parseIntake, 'case', 'save_intake'],
    };
    if (FORMS[path]) {
      const [key, parse, errorView, action] = FORMS[path];
      const result = parse(data, now());
      if (result.errors) { state.errors = result.errors; return go(errorView, stay); }
      state[key] = result[key];
      log(action);
      return go('case');
    }
    if (path === BASE + '/checklist') {
      if ((form.getAttribute('method') || 'get').toLowerCase() === 'get') {
        state.disorder = data.disorder;
        return go('checklist');
      }
      const id = url.searchParams.get('disorder');
      const disorder = D.findDisorder(id);
      const ratings = {};
      for (const cid of D.criterionIds(disorder)) if (D.RATINGS.includes(data[cid])) ratings[cid] = data[cid];
      const specifiers = {};
      for (const sp of disorder.specifiers) {
        const v = data['spec_' + sp.id];
        if (sp.options.some((o) => o.value === v)) specifiers[sp.id] = v;
      }
      state.checklists[id] = { ratings, specifiers, notes: String(data.notes || '').slice(0, 5000), updated_at: now() };
      state.disorder = id;
      log('save_checklist', disorder.name);
      return go('checklist', stay);
    }
    if (path === BASE + '/diagnoses') {
      const result = D.applyDiagnosis(
        { patient: state.patient, checklists: state.checklists, diagnoses: state.diagnoses },
        { disorderId: data.disorder, action: data.action, note: data.note, override: data.override },
        now()
      );
      if (result.error) state.errors = [result.error];
      else { state.diagnoses = result.diagnoses; log('diagnosis', data.action + ' ' + data.disorder); }
      return go('case', stay);
    }
    if (path === BASE + '/finalize') {
      state.diagnoses.finalNote = String(data.final_note || '');
      const blocker = D.finalizeBlocker(caseObject());
      if (blocker) { state.errors = [blocker]; return go('case', stay); }
      state.finalizedAt = now();
      log('finalize');
      return go('final');
    }
    if (path === BASE + '/reopen') {
      const reason = String(data.reason || '').trim();
      if (!reason) { state.errors = ['Write why the assessment is reopened.']; return go('case', stay); }
      state.amendments.push({ reopened_at: now(), by: CLINICIAN.name, reason, previously_finalized_at: state.finalizedAt,
        diagnoses_before: state.diagnoses.items.map((d) => d.code + ' ' + d.name) });
      state.finalizedAt = null;
      log('reopen', reason);
      return go('case');
    }
    if (path === PATIENT + '/followups') {
      state.followupMode = data.mode === 'onsite' ? 'onsite' : 'link';
      state.followupLanguage = D.lang(data.language);
      state.patient.preferred_language = state.followupLanguage;
      log('start_followup', state.followupMode + ', ' + state.followupLanguage);
      if (state.followupMode === 'link') {
        state.followupLink = { url: HOST + '/f/' + FTOKEN, expires: '2026-11-20' };
        return go('followup');
      }
      return go('followup-form');
    }
    if (path === '/f/' + FTOKEN || path === '/clinician/followups/2') {
      const { answers, errors } = D.parseFollowupAnswers(data);
      if (errors.length) { state.errors = [D.STRINGS[state.followupLanguage].missing(errors.length)]; return go('followup-form', stay); }
      state.followups.unshift({ id: state.followups.length + 1, completed_at: now(), results_json: JSON.stringify(D.scoreFollowup(answers)), revoked: 0, expires_at: '2099-01-01' });
      state.followupLink = null;
      return go(path.startsWith('/f/') ? 'followup-thanks' : 'followup');
    }
  });

  // ---------- Demo controls ----------
  const stepsEl = document.getElementById('steps');
  STEPS.forEach((s, i) => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = '#' + s.id;
    a.dataset.view = s.id;
    a.innerHTML = `<span class="n">${i + 1}</span><span><span class="who"></span><br><span class="label"></span></span>`;
    a.addEventListener('click', (e) => {
      e.preventDefault();
      // The follow-up step shows the follow-up form when a link has just been made.
      go(s.id === 'followup' && state.followupLink ? 'followup-form' : s.id, { scroll: false });
    });
    li.append(a);
    stepsEl.append(li);
  });

  // The demo page's own texts, in the clinician's language.
  function renderChrome() {
    const lang = uiLanguage();
    document.documentElement.lang = lang;
    document.title = L('title');
    document.getElementById('demo-intro').textContent = L('intro');
    document.getElementById('demo-foot').textContent = L('foot');
    document.getElementById('steps-nav').setAttribute('aria-label', L('stepsLabel'));
    document.getElementById('desktop-btn').textContent = L('desktop');
    document.getElementById('phone-btn').textContent = L('phone');
    document.getElementById('role-btn').textContent = asSupervisor ? L('supervisorOn') : L('supervisor');
    document.getElementById('reset-btn').textContent = L('reset');
    STEPS.forEach((step, i) => {
      const a = stepsEl.children[i].firstChild;
      a.querySelector('.who').textContent = L(step.who);
      a.querySelector('.label').textContent = L('steps')[step.id];
    });
  }

  const win = document.getElementById('window');
  const desktopBtn = document.getElementById('desktop-btn');
  const phoneBtn = document.getElementById('phone-btn');
  function setPhone(on) {
    win.classList.toggle('phone', on);
    phoneBtn.setAttribute('aria-pressed', String(on));
    desktopBtn.setAttribute('aria-pressed', String(!on));
  }
  desktopBtn.addEventListener('click', () => setPhone(false));
  phoneBtn.addEventListener('click', () => setPhone(true));
  const roleBtn = document.getElementById('role-btn');
  roleBtn.addEventListener('click', () => {
    asSupervisor = !asSupervisor;
    roleBtn.setAttribute('aria-pressed', String(asSupervisor));
    go(current, { scroll: false });
  });
  document.getElementById('reset-btn').addEventListener('click', () => { reset(); setDemoLanguage(uiLanguage()); go('login', { scroll: false }); });

  const VIEWS = new Set([...STEPS.map((s) => s.id), ...Object.keys(EXTRA)]);
  function fromHash() {
    const h = location.hash.slice(1);
    return VIEWS.has(h) ? h : 'login';
  }
  window.addEventListener('hashchange', () => { const v = fromHash(); if (v !== current) go(v, { scroll: false }); });

  reset();
  go(fromHash(), { scroll: false });
})();
</script>
